<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mining Heater</title>

    <!-- PWA Meta Tags (carried over from v1 so home-screen installs keep working) -->
    <meta name="description" content="Monitor and manage your home Bitcoin mining operations">
    <meta name="theme-color" content="#0f1115">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mining Dash">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72x72.png">

    <!-- Apple Touch Icons (iOS requires exact sizes, no transparency) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167x167.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120x120.png">
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png">

    <style>
    /* ---- tokens ---- */
    :root {
      --bg: #0f1115; --card: #171a21; --card2: #1e2230; --border: #262b38;
      --text: #e6e9f0; --muted: #8b93a7; --accent: #f7931a;
      --ok: #4ade80; --warn: #fbbf24; --crit: #f87171;
      --radius: 8px; --gap: 12px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    /* ---- reset & base ---- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45; min-height: 100vh; }
    button, input, select { font: inherit; color: inherit; }
    a { color: var(--accent); text-decoration: none; }
    svg { display: block; }
    ::-webkit-scrollbar { height: 6px; width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ---- shell ---- */
    .shell { max-width: 1100px; margin: 0 auto; padding: 0 12px calc(70px + env(safe-area-inset-bottom)); }
    .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 2px 8px; }
    .topbar h1 { font-size: 18px; font-weight: 700; letter-spacing: .2px; flex: 1; }
    .topbar h1 span { color: var(--accent); }
    .ws-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--crit); flex: none; }
    .ws-dot.open { background: var(--ok); }
    .banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--radius); margin-bottom: var(--gap); border: 1px solid var(--border); background: var(--card); }
    .banner.ok { border-color: rgba(74,222,128,.35); background: rgba(74,222,128,.08); }
    .banner.warn { border-color: rgba(251,191,36,.4); background: rgba(251,191,36,.09); }
    .banner.critical { border-color: rgba(248,113,113,.5); background: rgba(248,113,113,.12); }
    .banner.dry { border-color: rgba(247,147,26,.45); background: rgba(247,147,26,.08); }
    .banner.grey { color: var(--muted); }
    .banner .msg { flex: 1 1 200px; }

    /* ---- tabs ---- */
    .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; background: rgba(23,26,33,.97); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(8px); }
    .tabbar button { flex: 1; background: none; border: none; color: var(--muted); padding: 8px 0 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; }
    .tabbar button.active { color: var(--accent); }
    .tabbar svg { width: 22px; height: 22px; }

    /* ---- cards / layout ---- */
    .grid { display: grid; grid-template-columns: 1fr; gap: var(--gap); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .card > h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .card > h3 .spacer { flex: 1; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--gap); }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
    .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    .stat .value { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .stat .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ---- badges / buttons ---- */
    .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
    .badge.ok { color: var(--ok); border-color: rgba(74,222,128,.4); }
    .badge.warn { color: var(--warn); border-color: rgba(251,191,36,.45); }
    .badge.crit { color: var(--crit); border-color: rgba(248,113,113,.5); }
    .badge.accent { color: var(--accent); border-color: rgba(247,147,26,.5); }
    .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn { background: var(--card2); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius); padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
    .btn:hover:not(:disabled) { border-color: var(--muted); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn.accent { background: var(--accent); border-color: var(--accent); color: #14100a; }
    .btn.danger { background: rgba(248,113,113,.15); border-color: var(--crit); color: var(--crit); }
    .btn.ghost { background: none; }
    .btn.small { padding: 4px 10px; font-size: 12px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--card2); }
    .seg button { background: none; border: none; padding: 7px 14px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; border-right: 1px solid var(--border); }
    .seg button:last-child { border-right: none; }
    .seg button.on { background: var(--accent); color: #14100a; }
    .seg button:disabled { opacity: .45; cursor: default; }
    .seg.small button { padding: 4px 10px; font-size: 12px; }
    .stepper { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); }
    .stepper button { background: var(--card2); border: none; width: 44px; height: 44px; font-size: 20px; cursor: pointer; color: var(--text); }
    .stepper button:disabled { opacity: .4; cursor: default; }
    .stepper .val { min-width: 92px; text-align: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0 8px; }
    .stepper .val .unit { font-size: 13px; color: var(--muted); font-weight: 600; }
    .thermo-now { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .rowline { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-bottom: 1px solid rgba(38,43,56,.5); font-size: 13px; }
    .rowline:last-child { border-bottom: none; }
    .rowline .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ---- forms ---- */
    .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; min-width: 0; }
    .field > .flabel { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
    .field .hint { font-size: 11px; color: var(--muted); opacity: .75; }
    .field input, .field select { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text); width: 100%; }
    .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
    .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .toggle input { display: none; }
    .toggle .track { width: 38px; height: 22px; border-radius: 999px; background: var(--border); position: relative; transition: background .15s; flex: none; }
    .toggle .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: all .15s; }
    .toggle input:checked + .track { background: var(--accent); }
    .toggle input:checked + .track::after { left: 19px; background: #14100a; }
    .toggle.disabled { opacity: .5; cursor: default; }
    input[type=range] { width: 100%; accent-color: var(--accent); }

    /* ---- section / modal ---- */
    .section { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: var(--gap); overflow: hidden; }
    .section > .shead { display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer; background: var(--card2); font-weight: 600; font-size: 14px; }
    .section > .shead .chev { margin-left: auto; color: var(--muted); transition: transform .15s; }
    .section.open > .shead .chev { transform: rotate(90deg); }
    .section > .sbody { padding: 14px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); max-width: 440px; width: 100%; padding: 18px; max-height: 85vh; overflow-y: auto; }
    .modal h4 { margin-bottom: 10px; font-size: 16px; }
    .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    /* ---- domain widgets ---- */
    .boards { display: flex; gap: 8px; }
    .board-slot { flex: 1; border-radius: 6px; padding: 8px; text-align: center; border: 1px solid var(--border); background: var(--bg); font-size: 12px; }
    .board-slot .bid { font-weight: 700; font-size: 13px; }
    .board-slot.hashing { border-color: rgba(74,222,128,.6); background: rgba(74,222,128,.08); }
    .board-slot.fault { border-color: var(--crit); background: rgba(248,113,113,.1); }
    .board-slot.off { opacity: .55; }
    .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; gap: 10px; }
    .kv .k { color: var(--muted); flex: none; }
    .kv .v { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    table.plain { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
    table.plain th { text-align: right; color: var(--muted); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--border); }
    table.plain td { text-align: right; padding: 3px 6px; border-bottom: 1px solid rgba(38,43,56,.5); }
    table.plain th:first-child, table.plain td:first-child { text-align: left; }
    table.plain tr.now td { background: rgba(247,147,26,.1); }
    table.plain tr.total td { font-weight: 700; border-top: 1px solid var(--border); }
    .scroll-x { overflow-x: auto; }
    .paint-grid { display: grid; grid-template-columns: 34px repeat(24, 1fr); gap: 1px; user-select: none; touch-action: none; }
    .paint-grid .cell { aspect-ratio: 1/1.15; border-radius: 2px; background: var(--card2); min-width: 8px; }
    .paint-grid .dlab, .paint-grid .hlab { font-size: 10px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; background: var(--card2); display: inline-flex; gap: 6px; align-items: center; }
    .chip.sel { border-color: var(--accent); color: var(--accent); }
    .chip input { width: 44px; background: none; border: none; border-bottom: 1px solid var(--border); color: var(--text); font-size: 12px; text-align: right; }
    .linechart { position: relative; }
    .linechart .ylab { position: absolute; font-size: 10px; color: var(--muted); left: 2px; transform: translateY(-50%); background: rgba(23,26,33,.7); padding: 0 3px; border-radius: 3px; }
    .linechart .ylab.right { left: auto; right: 2px; }
    .xlabs { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 2px; }
    .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); flex-wrap: wrap; margin-top: 6px; }
    .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
    .events { display: flex; flex-direction: column; gap: 6px; }
    .event { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; background: var(--card2); border-radius: 6px; font-size: 13px; }
    .event .when { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .muted { color: var(--muted); }
    .mono { font-variant-numeric: tabular-nums; }
    .mt { margin-top: 10px; } .mb { margin-bottom: 10px; }
    .err-text { color: var(--crit); font-size: 12px; }
    .ok-text { color: var(--ok); font-size: 12px; }

    /* ---- desktop ---- */
    @media (min-width: 900px) {
      .shell { padding-bottom: 24px; }
      .grid { grid-template-columns: 1fr 1fr; }
      .grid > .wide { grid-column: 1 / -1; }
      .tabbar { position: sticky; top: 0; bottom: auto; border-top: none; border-bottom: 1px solid var(--border); max-width: 1100px; margin: 0 auto; justify-content: flex-start; }
      .tabbar button { flex: none; flex-direction: row; gap: 7px; padding: 12px 18px; font-size: 14px; }
      .tabbar svg { width: 17px; height: 17px; }
      .frow { grid-template-columns: 1fr 1fr 1fr; }
    }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Vendored libs — no CDN; UI must load with no internet (DESIGN §2) -->
    <script src="/vendor/react.production.min.js"></script>
    <script src="/vendor/react-dom.production.min.js"></script>
    <script src="/vendor/babel.min.js"></script>

    <!-- App (JSX, transformed in-browser by babel-standalone; order matters: app.js mounts last) -->
    <script type="text/babel" data-presets="react" src="/app/ui.js"></script>
    <script type="text/babel" data-presets="react" src="/app/overview.js"></script>
    <script type="text/babel" data-presets="react" src="/app/control.js"></script>
    <script type="text/babel" data-presets="react" src="/app/history.js"></script>
    <script type="text/babel" data-presets="react" src="/app/settings.js"></script>
    <script type="text/babel" data-presets="react" src="/app/app.js"></script>

    <script>
      // Register the kill-switch worker so v1's cache-first worker gets replaced.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
      }
    </script>
</body>
</html>
