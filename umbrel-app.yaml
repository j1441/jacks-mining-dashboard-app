manifestVersion: 1
id: jacks-mining-dashboard-app
name: Mining Dashboard
tagline: Profit + heat autopilot for your Antminer home heater
icon: https://raw.githubusercontent.com/j1441/jacks-mining-dashboard-app/main/icon.svg
category: automation
version: "2.1.1"
port: 3456
description: >-
  Monitor your Antminer running Braiins OS with a clean, modern web interface.
  Perfect for home heating applications with real-time statistics and power control.


  Features:

  • Real-time hashrate, temperature, and performance monitoring

  • Power profile control (Low/Medium/High) for optimal home heating

  • Norgespris vs Spotpris toggle - choose between spot price only or total cost including grid fees

  • Pool statistics and connection status

  • Temperature tracking for all boards and chips

  • Fan speed monitoring

  • WebSocket-based live updates every 5 seconds

  • Clean, responsive dark theme interface

  • Works with Tailscale for remote access


  Requirements:

  • Antminer running Braiins OS

  • Network access to miner's CGMiner API (port 4028)

  • Miner must be on same network as Umbrel or accessible via routing
developer: j1441
website: https://github.com/j1441/jacks-mining-dashboard-app
dependencies: []
repo: https://github.com/j1441/jacks-mining-dashboard-app
support: https://github.com/j1441/jacks-mining-dashboard-app/issues
gallery:
  - https://i.imgur.com/placeholder1.png
  - https://i.imgur.com/placeholder2.png
releaseNotes: >-
  v2.1.0 — thermostat mode + UI polish.

  • Thermostat: set a target room temperature — the room is measured by the miner's own
  hashboard intake sensors (no extra hardware); heat demand modulates smoothly to hold it
  • The engine still optimises against prices: with a heat pump configured it only runs
  the miner when it is the cheaper way to make that heat
  • Room temp tile on Overview; per-board intake temps shown on the miner card
  • Control tab: one clean panel per miner (mode, dry run, manual controls together);
  offline miners collapse to a compact card instead of full panels and banners
  • Settings: clearer sections with inline explanations

submitter: j1441
submission: https://github.com/j1441/jacks-mining-dashboard-app